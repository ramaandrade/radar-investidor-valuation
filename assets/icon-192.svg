<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="50%" stop-color="#065F46"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>
    <linearGradient id="acc-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="192" height="192" rx="42" fill="url(#bg-grad)"/>
  <rect x="6" y="6" width="180" height="180" rx="36" fill="none" stroke="#10B981" stroke-width="2" stroke-opacity="0.3"/>
  
  <!-- Radar circles -->
  <circle cx="96" cy="96" r="64" fill="none" stroke="#34D399" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="4 3"/>
  <circle cx="96" cy="96" r="44" fill="none" stroke="#34D399" stroke-width="1.5" stroke-opacity="0.35"/>
  <circle cx="96" cy="96" r="22" fill="none" stroke="#34D399" stroke-width="1.5" stroke-opacity="0.5"/>
  
  <!-- Crosshairs -->
  <line x1="96" y1="24" x2="96" y2="168" stroke="#34D399" stroke-width="1.5" stroke-opacity="0.25"/>
  <line x1="24" y1="96" x2="168" y2="96" stroke="#34D399" stroke-width="1.5" stroke-opacity="0.25"/>

  <!-- Valuation Growth Wave -->
  <path d="M 40 130 Q 70 120 95 85 T 150 50" fill="none" stroke="url(#acc-grad)" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Target Pin / Bullseye Node -->
  <circle cx="150" cy="50" r="8" fill="#34D399" filter="url(#glow)"/>
  <circle cx="150" cy="50" r="4" fill="#022C22"/>

  <!-- Badge 6 -->
  <circle cx="48" cy="48" r="16" fill="#10B981"/>
  <text x="48" y="54" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="900" fill="#022C22" text-anchor="middle">6</text>
</svg>
