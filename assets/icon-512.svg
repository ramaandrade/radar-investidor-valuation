<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad-512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="50%" stop-color="#065F46"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>
    <linearGradient id="acc-grad-512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="glow-512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg-grad-512)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#10B981" stroke-width="4" stroke-opacity="0.3"/>
  
  <!-- Radar circles -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#34D399" stroke-width="3" stroke-opacity="0.25" stroke-dasharray="10 8"/>
  <circle cx="256" cy="256" r="115" fill="none" stroke="#34D399" stroke-width="3" stroke-opacity="0.35"/>
  <circle cx="256" cy="256" r="60" fill="none" stroke="#34D399" stroke-width="3.5" stroke-opacity="0.5"/>
  
  <!-- Crosshairs -->
  <line x1="256" y1="64" x2="256" y2="448" stroke="#34D399" stroke-width="3" stroke-opacity="0.25"/>
  <line x1="64" y1="256" x2="448" y2="256" stroke="#34D399" stroke-width="3" stroke-opacity="0.25"/>

  <!-- Valuation Growth Wave -->
  <path d="M 110 350 Q 185 320 250 230 T 400 135" fill="none" stroke="url(#acc-grad-512)" stroke-width="11" stroke-linecap="round" filter="url(#glow-512)"/>
  
  <!-- Target Pin / Bullseye Node -->
  <circle cx="400" cy="135" r="20" fill="#34D399" filter="url(#glow-512)"/>
  <circle cx="400" cy="135" r="10" fill="#022C22"/>

  <!-- Badge 6 -->
  <circle cx="125" cy="125" r="42" fill="#10B981"/>
  <text x="125" y="141" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="44" font-weight="900" fill="#022C22" text-anchor="middle">6</text>
</svg>
